osc=no
border=no
cursor-autohide=500

vo=gpu-next
gpu-api=vulkan
gpu-context=x11vk
hwdec=nvdec                      # Direct copy-less decoding to VRAM (faster than nvdec-copy)

profile=fast
dither-depth=no

video-sync=audio                 # Bypasses display-resample overhead for instant frame start
interpolation=no
framedrop=vo

demuxer-lavf-probesize=32768     # Minimal probe window
demuxer-lavf-analyzeduration=0
demuxer-lavf-buffersize=32768
demuxer-thread=yes
demuxer-readahead-secs=5         # Low initial buffer to trigger immediate playback

hr-seek=no
hr-seek-framedrop=yes
save-position-on-quit=no

ytdl-format="bestvideo[height<=1080][vcodec^=avc1]+bestaudio/best[height<=1080]/best"
ytdl-raw-options=format-sort="res:1080,vcodec:h264",extractor-args="youtube:player_client=android,web"
cache=yes
cache-secs=10
