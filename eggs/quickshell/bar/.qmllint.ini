# Quickshell generates qmldir files only in its /run VFS, so qmllint/qmlls flag every
# `pragma Singleton` file as "not declared as singleton in qmldir". That warning has no
# line number, so `// qmllint disable` comments cannot target it.
# Trade-off: bad imports are no longer flagged in the editor; Quickshell still refuses to
# load the config (see `quickshell log -c <config>`).
[Warnings]
ImportFailure=disable
